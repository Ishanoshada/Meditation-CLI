[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "meditation"
version = "3.0.0"
description = "A colorful, animated, cross-platform terminal meditation companion."
readme = "README.md"
requires-python = ">=3.7"
license = { text = "MIT" }
authors = [
    { name = "Ishan Oshada", email = "ic31908@gmail.com" }
]
keywords = ["meditation", "cli", "terminal", "mindfulness", "breathing", "ascii-art"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: Utilities",
]
dependencies = [
    "rich>=13.0.0"
]

[project.urls]
Homepage = "https://github.com/ishanoshada/Meditation-CLI"
Source = "https://github.com/ishanoshada/Meditation-CLI"
"Bug Tracker" = "https://github.com/ishanoshada/Meditation-CLI/issues"

[project.scripts]
meditation = "meditation.cli:main"

[tool.setuptools.packages.find]
include = ["meditation*"]
